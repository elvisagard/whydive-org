name: Build and Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: whydive-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_ASSET_BASE_URL=https://static.whydive.org
          tags: |
            ghcr.io/${{ github.repository_owner }}/whydive-org:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/whydive-org:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy production image through Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            "$COOLIFY_DEPLOY_WEBHOOK"
